<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>体重ダッシュボード</title>
<meta property="og:title" content="体重ダッシュボード">
<meta property="og:type" content="website">
<meta property="og:description" content="体重・体脂肪率・除脂肪体重の推移">
<meta property="og:image" content="{{OG_IMAGE_URL}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{OG_IMAGE_URL}}">
<meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="{{BASE}}manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='22'%20fill='%230284c7'/%3E%3Cpolyline%20points='18,66%2034,50%2048,58%2066,36%2082,44'%20fill='none'%20stroke='%23ffffff'%20stroke-width='7'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{BASE}}styles.css?v={{ASSET_VERSION}}">
<script>
/* FOUC回避: 保存済みテーマをCSS適用前に反映する */
(function () {
  try {
    var t = localStorage.getItem('dash-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) { /* localStorage不可でもデフォルトテーマで動作 */ }
})();
</script>
</head>
<body>
<main class="container">
  <header class="app-header">
    <div class="title-row">
      <h1>体重ダッシュボード</h1>
      <p class="header-meta">
        <span id="hero-diff">7日平均比 —</span>
        <span id="hero-measured">最終計測 —</span>
      </p>
      <div class="title-actions">
        <span id="offline-badge" class="offline-badge" hidden>オフライン</span>
        <button id="theme-toggle" class="ghost-btn" type="button" aria-label="テーマ切替">テーマ</button>
      </div>
    </div>
  </header>

  <div id="state-skeleton" class="skeleton-group" aria-hidden="true">
    <div class="skeleton-cards">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
    <div class="skeleton skeleton-chart"></div>
  </div>

  <div id="state-empty" class="state-box hidden" role="status">
    <p id="empty-message">まだ表示できるデータがありません。</p>
    <button id="empty-reload" class="primary-btn" type="button">再読み込み</button>
  </div>

  <div id="state-error" class="state-box hidden" role="alert">
    <p>データの取得に失敗しました。</p>
    <button id="retry-btn" class="primary-btn" type="button">再試行</button>
  </div>

  <div id="content" class="hidden">
    <section class="cards">
      <article class="card">
        <h3>体重</h3>
        <p class="card-value"><span id="card-weight-value">—</span><span class="unit">kg</span></p>
        <p class="card-sub">7日平均 <span id="card-weight-avg">—</span><span class="unit">kg</span></p>
        <p class="card-sub">期間比 <span id="card-weight-diff">—</span><span class="unit">kg</span></p>
      </article>
      <article class="card">
        <h3>体脂肪率</h3>
        <p class="card-value"><span id="card-fat-value">—</span><span class="unit">%</span></p>
        <p class="card-sub">7日平均 <span id="card-fat-avg">—</span><span class="unit">%</span></p>
        <p class="card-sub">期間比 <span id="card-fat-diff">—</span><span class="unit">%</span></p>
      </article>
      <article class="card">
        <h3>除脂肪体重</h3>
        <p class="card-value"><span id="card-ffm-value">—</span><span class="unit">kg</span></p>
        <p class="card-sub">7日平均 <span id="card-ffm-avg">—</span><span class="unit">kg</span></p>
        <p class="card-sub">期間比 <span id="card-ffm-diff">—</span><span class="unit">kg</span></p>
      </article>
    </section>
    <div class="controls-row">
      <div class="segment" role="group" aria-label="表示期間">
        <button type="button" class="segment-btn active" data-period="1m" aria-pressed="true">1M</button>
        <button type="button" class="segment-btn" data-period="3m" aria-pressed="false">3M</button>
        <button type="button" class="segment-btn" data-period="1y" aria-pressed="false">1Y</button>
        <button type="button" class="segment-btn" data-period="custom" aria-pressed="false"><span class="label-long">カスタム</span><span class="label-short">C</span></button>
      </div>
      <div class="controls-right">
        <div class="segment" role="group" aria-label="表示系列">
          <button type="button" class="segment-btn active" data-mode="raw" aria-pressed="true">実測</button>
          <button type="button" class="segment-btn" data-mode="avg" aria-pressed="false"><span class="label-long">7日平均</span><span class="label-short">平均</span></button>
        </div>
        <button id="view-toggle" class="ghost-btn view-toggle" type="button" aria-pressed="false">表で見る</button>
      </div>
    </div>

    <div id="custom-range" class="custom-range hidden">
      <label>開始日 <input type="date" id="custom-from"></label>
      <label>終了日 <input type="date" id="custom-to"></label>
      <button id="custom-apply" class="primary-btn" type="button">適用</button>
      <span id="custom-error" class="custom-error" role="alert"></span>
    </div>

    <section id="chart-section">
      <div id="chart-wrap" class="chart-wrap">
        <canvas id="chart" role="img" aria-label="体重・体脂肪率・除脂肪体重の推移グラフ"></canvas>
      </div>
    </section>

    <div id="table-wrap" class="table-wrap hidden">
      <div class="table-controls">
        <div class="segment" role="group" aria-label="表の粒度">
          <button type="button" class="segment-btn active" data-table-mode="daily" aria-pressed="true">日次</button>
          <button type="button" class="segment-btn" data-table-mode="raw" aria-pressed="false">計測明細</button>
        </div>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th id="table-col-date">日付</th>
            <th>体重 <span class="unit">kg</span></th>
            <th>体脂肪率 <span class="unit">%</span></th>
            <th>除脂肪体重 <span class="unit">kg</span></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

  </div>

  <noscript><p class="state-box">このダッシュボードの表示にはJavaScriptが必要です。</p></noscript>

  <footer class="app-footer">
    <a href="https://github.com/okash1n/withings" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      okash1n/withings
    </a>
  </footer>
</main>
<script src="{{BASE}}vendor/chart.umd.js?v={{ASSET_VERSION}}"></script>
<script src="{{BASE}}app.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
