# AIコーチング講評を毎晩23:30 JSTに生成する（生成はClaudeサブスク、保存先はbodylogのAPI）。
# この機能は任意。Secrets未設定ならcheckジョブがスキップ判定するので、使わない場合は何もしなくてよい。
#
# 必要な GitHub Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN — `claude setup-token` で発行するサブスク用OAuthトークン（約1年有効）
#   COACHING_API_SECRET     — POST /api/coaching のBearerトークン（Worker側シークレットと同値）
#   BODYLOG_BASE_URL        — 本番URL（パブリックリポに実URLを書かないためSecretで渡す）
#
# 注意:
# - パブリックリポのActionsログは公開されるため、ジョブは講評本文・健康データをログに出さない
# - パブリックリポのscheduleは60日間リポジトリに動きがないと自動停止する（GitHub仕様）
name: AI Coaching

on:
  schedule:
    # 23:30 JST。当日分を生成し、23:55の日次ダイジェスト（Slack）が本文に差し込む。
    # 遅延で日付をまたいで起動した場合は前日分（本来の対象日）を生成する（generate.mjs のガード）。
    # この時刻を変えるときは coaching/dates.mjs の scheduleTargetDate 既定値（14:30 UTC）も合わせること
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "生成対象日 YYYY-MM-DD（ローカル日付、当日以前）。空なら当日。記録を後から足した日の講評を作り直すとき用"
        required: false
        type: string
        default: ""

# 対象日ごとに直列化する。group を固定にすると、待機中の実行が次の投入で置き換えられる GitHub の仕様により
# 複数の過去日を続けて投入したとき先の日付の再生成が黙って消える。schedule / date 未指定は 'today' に集約。
# 注意: 遅延で日付をまたいだ schedule 実行は実際には前日分を書くため、同じ前日を date 指定で手動投入すると
# group が別（today / 日付）になり直列化されない（どちらも有効な講評の upsert なので後勝ちで実害は小さい）
concurrency:
  group: coaching-${{ inputs.date || 'today' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # AIコーチングは任意機能。Secrets未設定のFork環境では失敗ではなくスキップにする
  # （スキップさせないと毎晩のschedule実行が失敗し続けて通知スパムになる）。
  # secretsコンテキストはjobレベルのifでは参照できないため、判定ジョブを挟む
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: AIコーチング用Secretsの有無を確認
        id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SECRET: ${{ secrets.COACHING_API_SECRET }}
          BASE: ${{ secrets.BODYLOG_BASE_URL }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$SECRET" ] && [ -n "$BASE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "AIコーチング用のSecrets（CLAUDE_CODE_OAUTH_TOKEN / COACHING_API_SECRET / BODYLOG_BASE_URL）が未設定のためスキップします（任意機能）" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  coaching:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coaching/package-lock.json
      - run: npm ci
        working-directory: coaching
      - run: node generate.mjs
        working-directory: coaching
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          COACHING_API_SECRET: ${{ secrets.COACHING_API_SECRET }}
          BODYLOG_BASE_URL: ${{ secrets.BODYLOG_BASE_URL }}
          # schedule 実行では inputs が空 → 直近の予定スロットが属する日（通常は当日、
          # 遅延で日付をまたいだ場合は前日）を generate.mjs が対象にする
          COACHING_DATE: ${{ inputs.date }}
          COACHING_SCHEDULED: ${{ github.event_name == 'schedule' }}
