# main への push で テスト → D1マイグレーション → wrangler deploy を実行する。
#
# 必要な GitHub Secrets:
#   WRANGLER_TOML        — 実値入り wrangler.toml の中身（リポジトリにはコミットしない）
#   CLOUDFLARE_API_TOKEN — Cloudflare APIトークン（Workers Scripts:Edit / D1:Edit / 対象ゾーン）
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # デプロイ用Secrets未設定のFork/clone環境では、mainへのpushでも失敗ではなくスキップにする
  # （secretsコンテキストはjobレベルのifで参照できないため、判定ジョブを挟んでneedsで渡す）
  precheck:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: デプロイ用Secretsの有無を確認
        id: check
        env:
          WRANGLER_TOML: ${{ secrets.WRANGLER_TOML }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$WRANGLER_TOML" ] && [ -n "$CF_TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "WRANGLER_TOML / CLOUDFLARE_API_TOKEN が未設定のためデプロイをスキップします（READMEの「自動デプロイ」参照）" >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # フォークからのPRなど Secrets が無い環境では example で代用する
      # （vitest は wrangler.toml の存在を前提にするため）
      - name: Restore wrangler.toml
        env:
          WRANGLER_TOML: ${{ secrets.WRANGLER_TOML }}
        run: |
          if [ -n "$WRANGLER_TOML" ]; then
            printf '%s' "$WRANGLER_TOML" > wrangler.toml
          else
            cp wrangler.toml.example wrangler.toml
          fi
      - run: npm ci
      - run: npm run typecheck
      # npm test は sync-vendor を内包する（typecheck の副作用に依存しない）
      - run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.precheck.outputs.deploy == 'true'
    needs: [test, precheck]
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Restore wrangler.toml
        env:
          WRANGLER_TOML: ${{ secrets.WRANGLER_TOML }}
        run: |
          if [ -z "$WRANGLER_TOML" ]; then
            echo "WRANGLER_TOML secret is not set" >&2
            exit 1
          fi
          printf '%s' "$WRANGLER_TOML" > wrangler.toml
      - run: npm ci
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
