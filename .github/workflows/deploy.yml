# main への push で テスト → D1マイグレーション → wrangler deploy を実行する。
#
# 必要な GitHub Secrets:
#   WRANGLER_TOML        — 実値入り wrangler.toml の中身（リポジトリにはコミットしない）
#   CLOUDFLARE_API_TOKEN — Cloudflare APIトークン（Workers Scripts:Edit / D1:Edit / 対象ゾーン）
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # canonical（okash1n/bodylog）の main push で Secrets が欠落していたら明示的に失敗させ、
  # デプロイ用Secrets未設定のFork/clone環境では、mainへのpushでも失敗ではなくスキップにする
  # （secretsコンテキストはjobレベルのifで参照できないため、判定ジョブを挟んでneedsで渡す）
  precheck:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: デプロイ用Secretsの有無を確認
        id: check
        env:
          WRANGLER_TOML: ${{ secrets.WRANGLER_TOML }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$WRANGLER_TOML" ] && [ -n "$CF_TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.repository }}" = "okash1n/bodylog" ]; then
            # canonical main の push が本番へ配備されないのに workflow が緑のままだと、
            # 修正・migration の反映漏れに気付けない（静かな未配備）。ここは失敗にする
            echo "::error::canonical main への push ですが WRANGLER_TOML / CLOUDFLARE_API_TOKEN が未設定です。デプロイ資格を確認してください"
            exit 1
          else
            echo "WRANGLER_TOML / CLOUDFLARE_API_TOKEN が未設定のためデプロイをスキップします（READMEの「自動デプロイ」参照）" >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # フォークからのPRなど Secrets が無い環境では example で代用する
      # （vitest は wrangler.toml の存在を前提にするため）
      - name: Restore wrangler.toml
        env:
          WRANGLER_TOML: ${{ secrets.WRANGLER_TOML }}
        run: |
          if [ -n "$WRANGLER_TOML" ]; then
            printf '%s' "$WRANGLER_TOML" > wrangler.toml
          else
            cp wrangler.toml.example wrangler.toml
          fi
      # wrangler が routes のカスタムドメインをログへ出力しうるため、先にマスクする
      # （WRANGLER_TOML 全体は Secret として自動マスクされるが、その一部＝ドメイン単体は対象外。
      #   パブリックリポのログは公開されるので、本番ホスト名を出さない。AGENTS.md 参照）
      - name: Mask custom domains in logs
        run: |
          # ホスト名の形をした値だけをマスク登録する（余計な短い断片を登録すると、ログ中の
          # その文字すべてが***化されて可読性が壊れるため。tr -d はCRLF対策）。
          # 注意: routes は { pattern = "ホスト名", custom_domain = true } の形式を維持すること。
          # zone ルート形式（"host/path"）や単一引用符の TOML 文字列に変えるとこの抽出に掛からず、
          # マスクされないままステップは成功してしまう（サイレント失敗）
          grep -oE 'pattern *= *"[^"]+"' wrangler.toml | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '\r' \
            | grep -E '^[A-Za-z0-9*][A-Za-z0-9.*-]+\.[A-Za-z0-9-]+$' | sort -u | while read -r domain; do
            echo "::add-mask::$domain"
          done
      # 実値（カスタムドメイン・hex/UUID形状ID）の混入を fail-closed で検査（値は出力しない）。
      # canonical では restore 済み wrangler.toml のドメインも対象になる
      - name: Scan for real values
        run: ./scripts/scan-real-values.sh
      - run: npm ci
      - run: npm run typecheck
      # npm test は sync-vendor を内包する（typecheck の副作用に依存しない）
      - run: npm test

  # N-1 互換ハーネス: デプロイは「D1 migration 適用 → Worker 更新」の順のため、
  # 新スキーマ上で直前リビジョンの Worker が動く時間帯（デプロイ窓）がある。
  # 直前リビジョンのテスト一式に現行 migrations/ を重ねて実行し、この窓の互換性を検証する。
  # Secrets 不要（wrangler.toml.example を使用するためドメインマスクも不要）。
  # migrations に変更が無い場合と、直前リビジョンを特定できない場合（force-push・新ブランチ等）は skip 成功
  n1-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: current
      - name: 直前リビジョンを特定
        id: n1
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          SHA="$BEFORE"
          if [ "$EVENT" = "pull_request" ]; then SHA="$BASE"; fi
          if echo "$SHA" | grep -qE '^[0-9a-f]{40}$' && [ "$SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "直前リビジョンを特定できないため N-1 互換チェックをスキップします" >> "$GITHUB_STEP_SUMMARY"
          fi
      # 直前 SHA が履歴から消えている場合（force-push 等）は checkout 失敗を skip 扱いにする
      - name: 直前リビジョンを checkout
        if: steps.n1.outputs.run == 'true'
        id: checkout-n1
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.n1.outputs.sha }}
          path: n1
      - name: migrations の変更有無を確認
        if: steps.n1.outputs.run == 'true' && steps.checkout-n1.outcome == 'success'
        id: diffcheck
        run: |
          if diff -rq current/migrations n1/migrations > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "migrations に変更が無いため N-1 互換チェックをスキップします" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.diffcheck.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: n1/package-lock.json
      - name: 現行 migrations を直前リビジョンに重ねてテスト
        if: steps.diffcheck.outputs.changed == 'true'
        run: |
          rm -rf n1/migrations
          cp -R current/migrations n1/migrations
          cp n1/wrangler.toml.example n1/wrangler.toml
          cd n1
          npm ci
          npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.precheck.outputs.deploy == 'true'
    needs: [test, precheck, n1-compat]
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Restore wrangler.toml
        env:
          WRANGLER_TOML: ${{ secrets.WRANGLER_TOML }}
        run: |
          if [ -z "$WRANGLER_TOML" ]; then
            echo "WRANGLER_TOML secret is not set" >&2
            exit 1
          fi
          printf '%s' "$WRANGLER_TOML" > wrangler.toml
      # wrangler deploy がカスタムドメインをログへ出力するため、先にマスクする（test ジョブと同じ理由）
      - name: Mask custom domains in logs
        run: |
          # ホスト名の形をした値だけをマスク登録する（余計な短い断片を登録すると、ログ中の
          # その文字すべてが***化されて可読性が壊れるため。tr -d はCRLF対策）。
          # 注意: routes は { pattern = "ホスト名", custom_domain = true } の形式を維持すること。
          # zone ルート形式（"host/path"）や単一引用符の TOML 文字列に変えるとこの抽出に掛からず、
          # マスクされないままステップは成功してしまう（サイレント失敗）
          grep -oE 'pattern *= *"[^"]+"' wrangler.toml | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '\r' \
            | grep -E '^[A-Za-z0-9*][A-Za-z0-9.*-]+\.[A-Za-z0-9-]+$' | sort -u | while read -r domain; do
            echo "::add-mask::$domain"
          done
      - run: npm ci
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
